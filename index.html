<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .chat-container { width: 100%; max-width: 480px; height: 85vh; max-height: 650px; background: #ffffff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #635bff; color: #ffffff; padding: 16px 20px; font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 14px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .message.user { align-self: flex-end; background: #635bff; color: #ffffff; border-bottom-right-radius: 2px; }
        .message.bot { align-self: flex-start; background: #f0f2f5; color: #1f2937; border-bottom-left-radius: 2px; }
        .message.loading { align-self: flex-start; background: #f0f2f5; color: #6b7280; font-style: italic; }
        .chat-input-area { padding: 15px; background: #ffffff; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; border: 1px solid #d1d5db; border-radius: 24px; padding: 12px 18px; font-size: 0.95rem; outline: none; }
        .chat-input-area input:focus { border-color: #635bff; }
        .chat-input-area button { background: #635bff; color: #ffffff; border: none; border-radius: 24px; padding: 0 20px; font-weight: 600; cursor: pointer; }
        .chat-input-area button:hover { background: #4e44e6; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span class="status-dot"></span> AI Консультант
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">Здравствуйте! Чем я могу вам помочь?</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Отправить</button>
    </div>
</div>

<script>
    // ВСТАВЬТЕ СЮДА ВАШ WEBHOOK URL ИЗ MAKE
    const MAKE_WEBHOOK_URL = 'https://hook.us2.make.com/r7gfeb19i4syw23euv358ew3wrio1k31';

    let sessionId = localStorage.getItem('chat_session_id');
    if (!sessionId) {
        sessionId = 'user_' + Math.random().toString(36).substring(2, 11);
        localStorage.setItem('chat_session_id', sessionId);
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        input.value = '';

        const loadingId = appendMessage('Печатает...', 'loading');

        try {
            const response = await fetch(MAKE_WEBHOOK_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: text, sessionId: sessionId })
            });

            const data = await response.json();
            document.getElementById(loadingId)?.remove();

            const botAnswer = data.output || data.response || 'Ответ получен.';
            appendMessage(botAnswer, 'bot');
        } catch (error) {
            document.getElementById(loadingId)?.remove();
            appendMessage('Ошибка соединения. Проверьте CORS в Make.', 'bot');
        }
    }

    function appendMessage(text, type) {
        const container = document.getElementById('chatMessages');
        const msg = document.createElement('div');
        const id = 'msg_' + Date.now();
        msg.id = id;
        msg.className = `message ${type}`;
        msg.innerText = text;
        container.appendChild(msg);
        container.scrollTop = container.scrollHeight;
        return id;
    }
</script>

</body>
</html>
